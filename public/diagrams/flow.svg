<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Mellon adjudication flow</title>
  <desc id="desc">A requester's statement goes through the gateway to Jev with the ruleset. Jev returns probabilities to a policy engine in code. On grant the vault releases the payload; on deny or error nothing is released. The payload never crosses the model exclusion boundary.</desc>
  <style>
    .bg { fill: #08090a; }
    .box { fill: #0e1012; stroke: #353a41; stroke-width: 1.5; }
    .box.jev { stroke: #f5f6f7; }
    .box.grant { stroke: #35d07f; }
    .box.deny { stroke: #ff4d4f; }
    .t { font: 600 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #f5f6f7; letter-spacing: 0.08em; }
    .s { font: 400 11.5px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #868d96; }
    .h { font: 600 12px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #868d96; letter-spacing: 0.16em; }
    .lbl { font: 500 11px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #e8eaed; letter-spacing: 0.06em; }
    .lbl.g { fill: #35d07f; } .lbl.r { fill: #ff4d4f; } .lbl.a { fill: #ffb020; }
    .flow { fill: none; stroke: #868d96; stroke-width: 1.6; stroke-dasharray: 6 5; animation: f 1.1s linear infinite; }
    .flow.g { stroke: #35d07f; } .flow.r { stroke: #ff4d4f; }
    .boundary { fill: rgba(255, 176, 32, 0.04); stroke: #ffb020; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .never { stroke: #ff4d4f; stroke-width: 1.4; stroke-dasharray: 2 5; fill: none; }
    @keyframes f { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#868d96"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35d07f"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d4f"/></marker>
  </defs>
  <rect class="bg" width="960" height="460"/>
  <text class="h" x="24" y="30">FIG. 1 — ADJUDICATION FLOW</text>

  <!-- Model exclusion boundary -->
  <rect class="boundary" x="530" y="44" width="240" height="140"/>
  <text class="lbl a" x="542" y="62">MODEL EXCLUSION BOUNDARY</text>

  <!-- Top row -->
  <rect class="box" x="24" y="72" width="180" height="84"/>
  <text class="t" x="40" y="104">REQUESTER</text>
  <text class="s" x="40" y="126">statement of access</text>
  <text class="s" x="40" y="142">in plain English</text>

  <rect class="box" x="268" y="72" width="180" height="84"/>
  <text class="t" x="284" y="104">GATEWAY</text>
  <text class="s" x="284" y="126">validate · rate limit</text>
  <text class="s" x="284" y="142">10 / min / lock</text>

  <rect class="box jev" x="560" y="80" width="180" height="84"/>
  <text class="t" x="576" y="112">JEV SYSTEM ONE</text>
  <text class="s" x="576" y="134">choice · score · noul</text>
  <text class="s" x="576" y="150">no text generated</text>

  <path class="flow" d="M204 114H262" marker-end="url(#a)"/>
  <text class="lbl" x="212" y="104">input</text>
  <path class="flow" d="M448 122H554" marker-end="url(#a)"/>
  <text class="lbl" x="456" y="112">ruleset +</text>
  <text class="lbl" x="456" y="140">statement</text>

  <!-- Down to policy -->
  <path class="flow" d="M650 164V284" marker-end="url(#a)"/>
  <text class="lbl" x="662" y="216">p(grant), confidence</text>
  <text class="lbl" x="662" y="232">compliance score</text>
  <text class="lbl" x="662" y="248">manipulation p</text>

  <rect class="box" x="560" y="290" width="180" height="84"/>
  <text class="t" x="576" y="322">POLICY ENGINE</text>
  <text class="s" x="576" y="344">thresholds in code</text>
  <text class="s" x="576" y="360">all checks must pass</text>

  <!-- Deny branch -->
  <path class="flow r" d="M740 332H794" marker-end="url(#ar)"/>
  <rect class="box deny" x="800" y="296" width="136" height="72"/>
  <text class="t" x="816" y="326" fill="#ff4d4f" style="fill:#ff4d4f">DENIED</text>
  <text class="s" x="816" y="348">nothing released</text>
  <text class="lbl r" x="744" y="390">DENY · ERROR · TIMEOUT</text>

  <!-- Grant branch to vault -->
  <rect class="box grant" x="268" y="290" width="180" height="84"/>
  <text class="t" x="284" y="322">VAULT</text>
  <text class="s" x="284" y="344">AES-256-GCM at rest</text>
  <text class="s" x="284" y="360">decrypts on grant only</text>
  <path class="flow g" d="M560 332H454" marker-end="url(#ag)"/>
  <text class="lbl g" x="482" y="322">GRANT</text>

  <path class="flow g" d="M268 332H114V162" marker-end="url(#ag)"/>
  <text class="lbl g" x="124" y="352">payload released</text>

  <!-- Never crosses -->
  <path class="never" d="M430 290L536 190"/>
  <path d="M476 232l14 14M490 232l-14 14" stroke="#ff4d4f" stroke-width="2.2"/>
  <text class="lbl r" x="370" y="226">payload never</text>
  <text class="lbl r" x="370" y="242">sent to model</text>

  <text class="s" x="24" y="436">The model only ever sees the ruleset and the request. Code, not the model, decides; the secret is decrypted after a grant.</text>
</svg>
