name: Jev live check

# Weekly (and on-demand) drift check against the real TypeSafe Jev API, so a
# change on Jev's side shows up even when nobody pushes. CI runs the same live
# tests on every push and pull request.
# Needs a TYPESAFE_API_KEY repository secret; without it the job is skipped.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Jev model to test (e.g. jev-latest, jev-1.13.0, jev-preview)
        default: jev-latest
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      JEV_MODEL: ${{ inputs.model || 'jev-latest' }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::notice::TYPESAFE_API_KEY secret is not set; skipping live Jev tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - name: Live Jev tests (${{ env.JEV_MODEL }})
        if: steps.key.outputs.present == 'true'
        run: npm run test:live
