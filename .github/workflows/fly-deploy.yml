name: Deploy to Fly.io

# Deploys main after CI passes, or on demand. Needs a FLY_API_TOKEN repository
# secret (fly tokens create deploy) and a FLY_APP repository variable naming an
# app already set up with scripts/fly-deploy.sh (volume and secrets exist).
# After deploying it checks the live site (scripts/check-deploy.sh) at the
# MELLON_FLY_URL repository variable, or https://<FLY_APP>.fly.dev.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$FLY_APP" ]; then
            echo "::notice::FLY_API_TOKEN secret or FLY_APP variable not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.cfg.outputs.ready == 'true'
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: flyctl deploy --remote-only --app "$FLY_APP" --ha=false
      - name: Check the live site
        if: steps.cfg.outputs.ready == 'true'
        run: scripts/check-deploy.sh "${{ vars.MELLON_FLY_URL || format('https://{0}.fly.dev', vars.FLY_APP) }}" file
