name: Deploy to Vercel

# Deploys main after CI passes, or on demand. Needs repository secrets
# VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID for a project already set up
# with scripts/vercel-deploy.sh (Redis and MELLON_SECRET_KEY configured).
# Without them the job is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Pull project settings
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes vercel@64 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes vercel@64 build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes vercel@64 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
