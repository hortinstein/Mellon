name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit and API tests
        run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      # Upstash's open-source REST adapter: a real Redis behind the same HTTP API Upstash serves.
      upstash:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the Redis REST endpoint
        run: |
          for i in $(seq 1 30); do
            curl -fs -X POST http://127.0.0.1:8079/pipeline -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' -d '[["PING"]]' && exit 0
            sleep 1
          done
          echo "Redis REST endpoint did not come up" >&2; exit 1
      - name: Build and smoke-test the image (volume, then Redis)
        env:
          SMOKE_REDIS_URL: http://host.docker.internal:8079
          SMOKE_REDIS_TOKEN: ci-token
        run: scripts/docker-smoke.sh mellon:ci

  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      # Upstash's open-source REST adapter: a real Redis behind the same HTTP API Upstash serves.
      upstash:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      MELLON_TEST_REDIS_URL: http://127.0.0.1:8079
      MELLON_TEST_REDIS_TOKEN: ci-token
      MELLON_REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the Redis REST endpoint
        run: |
          for i in $(seq 1 30); do
            curl -fs -X POST http://127.0.0.1:8079/pipeline -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' -d '[["PING"]]' && exit 0
            sleep 1
          done
          echo "Redis REST endpoint did not come up" >&2; exit 1
      - name: Storage, function instances and admin scripts against real Redis
        run: npm run test:redis

  upstash:
    name: Live Upstash
    runs-on: ubuntu-latest
    # Forked pull requests don't receive secrets, so they can't reach Upstash.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: upstash-live
      cancel-in-progress: false
    env:
      MELLON_TEST_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      MELLON_TEST_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      MELLON_REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Storage, function instances and admin scripts against Upstash
        run: npm run test:redis
      - name: Docker image on Upstash
        if: env.MELLON_TEST_REDIS_URL != ''
        env:
          SMOKE_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          SMOKE_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: scripts/docker-smoke.sh mellon:upstash

  jev-live:
    name: Live Jev API
    runs-on: ubuntu-latest
    # Forked pull requests don't receive secrets, so they can't call Jev.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
      MELLON_REQUIRE_JEV: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Real Jev calls (contract, verdicts, HTTP end to end, sign-in)
        run: npm run test:live

